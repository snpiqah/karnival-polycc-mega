<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - POLYCC Mega 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>KARNIVAL POLYCC MEGA 2026</h1>
        </header>

        <nav>
            <a href="index.html">HOME</a>
            <a href="competition.html">GALLERY</a>
            <a href="register.html" class="active">REGISTER</a>
        </nav>

        <div class="content-area">
            <h2>Participant Registration Form</h2>
            
            <form action="#" method="POST" class="registration-form">
                
                <div class="form-group">
                    <label for="fullname">Full Name :</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="age">Age (Mandatory Field )* :</label>
                    <input type="number" id="age" name="age" placeholder="Enter your age" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address :</label>
                    <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone No. :</label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g., 0123456789" required>
                </div>

                <div class="form-group">
                    <label for="competition">Competition :</label>
                    <select id="competition" name="competition" required>
                        <option value="" disabled selected>Select Competition</option>
                        <option value="robotics">AI Robotics competition</option>
                        <option value="drone">Drone competition</option>
                        <option value="cooking">Cooking competition</option>
                        <option value="code">Code design competition</option>
                        <option value="3dart">3D Sketch / 3D Art Competition</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" class="submit-btn">[SUBMIT]</button>
                </div>
            </form>
        </div>

        <footer>
            <p>&copy; 2026 Karnival POLYCC Mega | Organized by JPPKK | Managed by Webiture Enterprise</p>
        </footer>
    </div>

</body>
</html>
